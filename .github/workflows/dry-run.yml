name: Scheduled offline validation
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/pipeline/requirements.txt
      - run: python -m services.pipeline.scheduled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-status
          path: artifacts/pipeline-status.json
          if-no-files-found: error
# Live publication and email are intentionally unconfigured.
