name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  OPENAI_API_KEY: ''
  UNATTENDED_PAID_APPROVED: 'false'
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r services/pipeline/requirements.txt
      - name: Verify production safety defaults
        run: |
          python -m unittest discover -s deploy/linux -p 'test_*.py' -v
          python -m unittest packages.db.test_recovery -v
      - run: npm run db:generate
      - run: python tests/scan_secrets.py
      - run: npm test
      - run: npm run test:web
      - run: npm run pipeline
      - run: npm run pipeline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify installed Chrome sandbox helper
        run: |
          test -x /opt/google/chrome/chrome
          test -x /opt/google/chrome/chrome-sandbox
      - run: python tests/run_web_smoke.py
        env:
          DATA_MODE: fixture
          RUN_BROWSER: '1'
          BROWSER_EXECUTABLE: /opt/google/chrome/chrome
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
          CI_CHROMIUM_NO_SANDBOX: '1'
      - name: Browse artificial private review reports and gate-only previews
        run: python tests/run_review_smoke.py
        env:
          BROWSER_EXECUTABLE: /opt/google/chrome/chrome
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
          CI_CHROMIUM_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artificial-review-browser-report
          path: artifacts/review-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-browser-report
          path: artifacts/browser
          if-no-files-found: warn
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: digest
          POSTGRES_PASSWORD: digest
          POSTGRES_DB: digest
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U digest -d digest" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://digest:digest@localhost:5432/digest
      TEST_DATABASE_URL: postgresql://digest:digest@localhost:5432/digest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r services/pipeline/requirements.txt
      - name: Extract verification tools without installing services
        run: |
          # A runner can list an installed package after its version leaves the archive.
          archive_version() {
            apt-cache madison "$1" | awk -F '|' 'NR == 1 { gsub(/[[:space:]]/, "", $2); print $2 }'
          }
          sudo apt-get update
          if [ -z "$(archive_version postgresql-client-18)" ]; then
            curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/industrial-ai-pgdg.asc
            sudo install -m 0644 /tmp/industrial-ai-pgdg.asc /usr/share/keyrings/industrial-ai-pgdg.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/keyrings/industrial-ai-pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/industrial-ai-pgdg.list
            sudo apt-get update
          fi
          mkdir -p artifacts/ci-tools
          cd artifacts/ci-tools
          for package in caddy age postgresql-client-18 libpq5; do
            version="$(archive_version "$package")"
            if [ -z "$version" ]; then
              echo "No downloadable archive version for $package" >&2
              exit 1
            fi
            apt-get -o Acquire::Retries=3 download "$package=$version"
          done
          for archive in ./*.deb; do dpkg-deb --extract "$archive" extracted; done
          echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          echo "$PWD/extracted/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/extracted/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Validate Ubuntu service, timer, shell and TLS configuration
        run: python deploy/linux/validate_linux.py
      - name: Test encrypted backup and isolated restoration
        run: python -m unittest packages.db.test_recovery -v
        env:
          RUN_RECOVERY_INTEGRATION: '1'
          TEST_RECOVERY_ADMIN_URL: postgresql://digest:digest@localhost:5432/postgres
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: python -m unittest packages.db.test_tracker_migration -v
      # Include daily publication/resume and real concurrent monthly-budget integration.
      - run: python -m unittest discover -s tests -v
      - run: python -m services.pipeline.ingest --database "$DATABASE_URL"
      - run: python -m services.pipeline.ingest --database "$DATABASE_URL"
      - run: python -m services.pipeline.cli --database "$DATABASE_URL"
      - run: python -m services.pipeline.cli --database "$DATABASE_URL"
      - run: npm run db:seed
      - run: npm run db:seed
      - run: node --test packages/db/test-idempotency.cjs
      - run: npm run build
      - run: python tests/run_web_smoke.py
        env:
          DATA_MODE: database
          WEB_SMOKE_ISOLATED_DB: '1'
