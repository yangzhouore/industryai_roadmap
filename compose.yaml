services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: digest
      POSTGRES_PASSWORD: digest
      POSTGRES_DB: digest
    ports: ["5432:5432"]
    volumes: ["digest_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digest"]
      interval: 5s
      retries: 10
volumes:
  digest_data:
