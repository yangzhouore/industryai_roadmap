[Service]
SupplementaryGroups=industrial-ai
EnvironmentFile=/etc/industrial-ai/proxy.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/industrial-ai.Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/industrial-ai.Caddyfile --adapter caddyfile --force
ExecStartPre=/srv/industrial-ai/venv/bin/python /srv/industrial-ai/current/deploy/linux/preflight.py proxy
ReadWritePaths=/var/log/industrial-ai
